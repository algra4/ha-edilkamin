name: Tests
permissions:
  contents: read

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.13.2"]
        homeassistant-version: ["2025.5.0", "2025.9.0"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - name: Install dependencies with uv (using pyproject)
      run: |
        uv sync --all-extras --dev

    - name: Install Home Assistant ${{ matrix.homeassistant-version }}
      run: |
        uv pip install "homeassistant==${{ matrix.homeassistant-version }}"

    - name: Run tests with pytest (via uv)
      run: |
        # Keep the matrix version installed above instead of syncing the dev pin.
        uv run --no-sync python -c "import sys; from importlib.metadata import version; print('Python:', sys.version); print('Home Assistant:', version('homeassistant')); assert version('homeassistant') == '${{ matrix.homeassistant-version }}'"
        uv run --no-sync pytest tests/ -v --cov=custom_components --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.13'
      uses: codecov/codecov-action@v7
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
