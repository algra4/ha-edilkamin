name: Tests
permissions:
  contents: read

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.13"
            homeassistant-version: "2025.5.0"
          - python-version: "3.13"
            homeassistant-version: "2025.9.0"
          - python-version: "3.14"
            homeassistant-version: "2026.10.4"

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - name: Install test dependencies and Home Assistant
      run: |
        uv venv --python "${{ matrix.python-version }}"
        uv pip install -e . --group test "homeassistant==${{ matrix.homeassistant-version }}"

    # HA 2025.9's aiodns release uses pycares APIs removed in version 5.
    - name: Constrain pycares for Home Assistant 2025.9
      if: matrix.homeassistant-version == '2025.9.0'
      run: uv pip install 'pycares<5'

    - name: Run tests with pytest
      run: |
        .venv/bin/pytest tests/ -v --cov=custom_components --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      if: matrix.homeassistant-version == '2026.10.4'
      uses: codecov/codecov-action@v7
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
